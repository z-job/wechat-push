name: 'Weixin Push On Time (朝勃 × 小宝宝)'

on:
  # 仅通过 cron-job.org 外部精准定时唤醒或 GitHub 网页手动点击触发
  # 彻底移除了 GitHub 内部延迟严重的 schedule 定时器，杜绝 08:40 二次重复推送！
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Execute Push Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: 'Asia/Shanghai'
        run: npm run start
